name: Publish private MCP package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MCP package version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-private-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@steveyangpi'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify requested version
        run: |
          test "$(node --input-type=module -e "import p from './packages/mcp/package.json' with { type: 'json' }; console.log(p.version)")" = "$REQUESTED_VERSION"
      - run: npm run release:check
      - name: Refuse an existing package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@steveyangpi/binance-research-pro-mcp@$REQUESTED_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            printf 'Package version %s already exists.\n' "$REQUESTED_VERSION"
            exit 1
          fi
      - run: npm publish --workspace packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@steveyangpi'
      - run: npm ci --ignore-scripts
      - name: Install and smoke-test the published package
        env:
          MCP_PUBLISHED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node packages/mcp/scripts/published-package-smoke-test.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Published package is not ready yet; retrying in 15 seconds."
            sleep 15
          done
