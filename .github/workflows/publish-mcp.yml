name: Publish private MCP package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MCP package version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-private-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@steveyangpi'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify requested version
        run: |
          test "$(node --input-type=module -e "import p from './packages/mcp/package.json' with { type: 'json' }; console.log(p.version)")" = "${{ inputs.version }}"
      - run: npm run release:check
      - name: Refuse an existing package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@steveyangpi/binance-research-pro-mcp@${{ inputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package version ${{ inputs.version }} already exists."
            exit 1
          fi
      - run: npm publish --workspace packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the published package
        env:
          MCP_TEST_COMMAND: npx
          MCP_TEST_ARGS_JSON: '["-y", "--package=@steveyangpi/binance-research-pro-mcp@${{ inputs.version }}", "--", "binance-research-pro-mcp"]'
          BINANCE_RESEARCH_DATA_DIR: ${{ runner.temp }}/binance-research-pro-data
          npm_config_cache: ${{ runner.temp }}/npm-cache
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node packages/mcp/scripts/mcp-smoke-test.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Published package is not ready yet; retrying in 15 seconds."
            sleep 15
          done
